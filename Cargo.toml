[package]
name = "jimao"
version = "0.1.0"
edition = "2021"
description = "Jimao — a pure-Rust email client (IMAP & POP3) with an egui interface"
license = "MIT"

[dependencies]
eframe = "0.31"
egui = "0.31"

# TLS: rustls with the pure-Rust `ring` crypto provider (no OpenSSL / aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

# RFC 5322 message parsing (pure Rust). `full_encoding` pulls in encoding_rs
# (also pure Rust) so GBK/GB2312/Big5/Shift-JIS/… bodies decode correctly.
mail-parser = { version = "0.11", features = ["full_encoding"] }

# HTML mail rendering: html5ever DOM (pure Rust, from Servo) + egui widgets.
scraper = "0.27"
ego-tree = "0.11"

# Remote mail content (images/stylesheets), fetched on worker threads.
# ureq is synchronous + rustls-based (pure Rust; `tls` feature pulls rustls
# with the ring provider, gzip via miniz_oxide). Image decoding is pure Rust.
ureq = { version = "2.10", features = ["tls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
sha1_smol = "1.0"

# Inline cid: images are cached as base64 in the JSON message cache.
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
