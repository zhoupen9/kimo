[package]
name = "kimo"
version = "0.1.0"
edition = "2021"
description = "Kimo — a pure-Rust email client (IMAP & POP3) with an egui interface"
license = "MIT"

[dependencies]
# Kimo drives the window and the GPU itself — winit for the window and the
# event loop, `egui-winit` for input, `egui-wgpu` for egui's meshes (see
# `src/gpu.rs`) — rather than going through eframe. The reason is the floating
# title bar's frosted backdrop: the blur needs the pixels behind the bar, and
# wgpu gives no way to read a render target from inside the pass that draws it
# (that is GL's `glCopyTexSubImage2D`, which the glow build leaned on), so the
# frame has to be drawn in two passes with the backdrop copied and blurred
# between them. Only the code that builds the render passes can do that, and
# eframe owns its passes. egui and the egui crates stay in lockstep.
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = [
    "clipboard",
    "links",
    "wayland",
    "x11",
] }
pollster = "0.4"
wgpu = "30"
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
    "x11",
] }

# TLS: rustls with the pure-Rust `ring` crypto provider (no OpenSSL / aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# Finite-field DH (the TLS 1.2 `DHE-RSA-*` suites) for mail servers that offer
# nothing else — rustls implements DHE but ships no FFDHE group in any provider,
# so `src/protocol/ffdhe.rs` has to do the modular exponentiation itself.
# crypto-bigint is pure Rust and constant time (hard rule 1); only that module
# uses it, and only `alloc` is needed — the random helpers stay off.
crypto-bigint = { version = "0.7", default-features = false, features = [
    "alloc",
    "zeroize",
] }

# RFC 5322 message parsing (pure Rust). `full_encoding` pulls in encoding_rs
# (also pure Rust) so GBK/GB2312/Big5/Shift-JIS/… bodies decode correctly.
mail-parser = { version = "0.11", features = ["full_encoding"] }

# HTML mail rendering: html5ever DOM (pure Rust, from Servo) + egui widgets.
scraper = "0.27"
ego-tree = "0.11"

# Remote mail content (images/stylesheets), fetched on worker threads.
# ureq is synchronous + rustls-based (pure Rust; `tls` feature pulls rustls
# with the ring provider, gzip via miniz_oxide). Image decoding is pure Rust.
ureq = { version = "2.10", features = ["tls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
sha1_smol = "1.0"

# Base64 for `data:` URLs in HTML mail (Blitz decodes those); inline `cid:`
# images are raw bytes in the mail database, not base64.
base64 = "0.22"

# Mail storage: a single SQLite database (`~/.local/share/kimo/mail.db`) holds
# the accounts and all cached mail, and its FTS5 index backs the search UI.
# This is the project's one C dependency and an owner-approved exception to hard
# rule 1: `bundled` compiles the SQLite amalgamation — with FTS5 — through `cc`
# at build time and links it statically, so there is no system library, no
# pkg-config and no runtime requirement; the requested storage is specifically
# SQLite + FTS5. Everything else stays pure Rust: do not widen this into a habit.
# default-features off drops rusqlite's wasm FFI crate (sqlite-wasm-rs),
# which a native build never uses; "cache" keeps its statement cache.
rusqlite = { version = "0.40", default-features = false, features = [
    "bundled",
    "cache",
] }

# Full-fidelity HTML mail renderer (optional second content renderer, see
# src/blitz_render.rs): Blitz is a pure-Rust DOM/CSS/layout engine — stylo for
# CSS, taffy for layout, vello_cpu for CPU rasterization. No GPU, no async
# runtime. The blitz-*-0.3.0-beta.2 crates are pinned in lockstep (they require
# each other exactly), anyrender_vello_cpu 0.17 is the CPU ImageRenderer
# matching anyrender 0.13. The stylo crates are MPL-2.0 (file-level copyleft,
# fine for linking).
#
# blitz-dom is built with default-features = false on purpose: its
# "system-fonts" feature enables fontique's fontconfig backend, i.e. a C
# library (hard rule 1). Instead src/blitz_render.rs registers the fonts found
# on disk with parley/fontique, exactly like fonts.rs does for
# egui. "svg"/"woff" keep SVG images and embedded fonts working (pure Rust);
# "floats" turns on float layout, which HTML mail relies on heavily;
# "complex-scripts" hands parley the ICU4X CJK/Thai/Khmer/Lao dictionaries
# (already-compiled data). Without it every Chinese or Japanese run is logged
# as "No segmentation model for complex script" and is only broken by the
# coarse UAX-14 rules.
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = [
    "svg",
    "woff",
    "floats",
    "complex-scripts",
] }
blitz-html = { version = "=0.3.0-beta.2", default-features = false }
blitz-traits = { version = "=0.3.0-beta.2", default-features = false }
blitz-paint = { version = "=0.3.0-beta.2", default-features = false, features = ["svg"] }
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
# `Affine` for replaying a recorded page into per-slice surfaces (already in
# the tree via blitz; declared here because we name the type).
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Preferences → Appearance lists the installed font families. There is no
# fontconfig here (hard rule 1), so `fonts.rs` walks the font directories and
# reads each face's `name` table with ttf-parser: pure Rust, and already in
# the tree through Blitz (fontique/fontdb), so this pulls in no new build.
ttf-parser = "0.25"

[profile.release]
lto = true
strip = true
