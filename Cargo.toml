[workspace]
members = ["crates/*"]
default-members = ["crates/*", "."]
exclude = ["plugins"]
resolver = "2"

[package]
name = "kimo"
version = "0.1.0"
edition = "2021"
description = "Kimo — a pure-Rust email client (IMAP & POP3) with an egui interface"
license = "MIT"

[dependencies]
# The binary is only the winit/wgpu integration shell. The application is in
# kimo-ui; the worker, platform and rendering layers are the crates below it.
kimo-core = { path = "crates/kimo-core" }
kimo-protocol = { path = "crates/kimo-protocol" }
kimo-style = { path = "crates/kimo-style" }
kimo-platform = { path = "crates/kimo-platform" }
kimo-engine = { path = "crates/kimo-engine" }
kimo-ui = { path = "crates/kimo-ui" }

# Kimo drives the window and the GPU itself — winit for the window and the
# event loop, egui-winit for input, egui-wgpu for egui's meshes (see
# src/gpu.rs) — rather than going through eframe. The floating title bar's
# frosted backdrop needs the frame split in two, which eframe cannot do.
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = [
    "clipboard",
    "links",
    "wayland",
    "x11",
] }
pollster = "0.4"
wgpu = "30"
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
    "x11",
] }

[profile.release]
lto = true
strip = true
