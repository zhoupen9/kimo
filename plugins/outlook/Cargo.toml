[package]
name = "kimo-plugin-outlook"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Same shape as the Gmail module: interpreted by Kimo's wasmi host, never run
# natively, everything pure Rust (hard rule 1 holds inside a module too).
# mail-parser turns the host's rendered RFC 5322 bytes back into the message
# object Graph's `sendMail` takes.
[profile.release]
lto = true
strip = true
opt-level = "s"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
mail-parser = "0.11"
