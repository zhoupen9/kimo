[package]
name = "kimo-plugin-gmail"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Pure Rust only (hard rule 1 applies inside a module too): nothing here links
# a C library, and on wasm32 nothing can.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
