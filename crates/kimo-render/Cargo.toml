[package]
name = "kimo-render"
version = "0.1.0"
edition = "2021"
description = "Kimo's HTML mail rendering: the egui widget renderer and the Blitz raster renderer"
license = "MIT"
publish = false

[dependencies]
kimo-core = { path = "../kimo-core" }
kimo-style = { path = "../kimo-style" }
egui = "0.36"
scraper = "0.27"
ego-tree = "0.11"
csscolorparser = "0.9"
palette = { version = "0.7", default-features = false, features = ["std"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ureq = { version = "2.10", features = ["tls", "gzip"] }
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = [
    "svg",
    "woff",
    "floats",
    "complex-scripts",
] }
blitz-html = { version = "=0.3.0-beta.2", default-features = false }
blitz-traits = { version = "=0.3.0-beta.2", default-features = false }
blitz-paint = { version = "=0.3.0-beta.2", default-features = false, features = ["svg"] }
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["std"] }

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
