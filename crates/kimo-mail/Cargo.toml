[package]
name = "kimo-mail"
version = "0.1.0"
edition = "2021"
description = "Kimo's RFC 5322 parsing, composition, threading and folder classification"
license = "MIT"
publish = false

[dependencies]
kimo-core = { path = "../kimo-core" }
mail-parser = { version = "0.11", features = ["full_encoding"] }
scraper = "0.27"
base64 = "0.22"
sha1_smol = "1.0"
