[package]
name = "kimo-engine"
version = "0.1.0"
edition = "2021"
description = "Kimo's worker side: mailbox jobs, provider adapters, plugin host and event stream"
license = "MIT"
publish = false

[dependencies]
kimo-core = { path = "../kimo-core" }
kimo-mail = { path = "../kimo-mail" }
kimo-protocol = { path = "../kimo-protocol" }
kimo-store = { path = "../kimo-store" }
kimo-plugin-abi = { path = "../kimo-plugin-abi" }
kimo-style = { path = "../kimo-style" }
kimo-platform = { path = "../kimo-platform" }
kimo-render = { path = "../kimo-render" }
egui = "0.36"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["tls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
wasmi = "2.0.0"
wasmi_core = "2.0.0"

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
