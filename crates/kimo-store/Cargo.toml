[package]
name = "kimo-store"
version = "0.1.0"
edition = "2021"
description = "Kimo's SQLite store: accounts, cached mail, labels and FTS5 search"
license = "MIT"
publish = false

[dependencies]
kimo-core = { path = "../kimo-core" }
kimo-mail = { path = "../kimo-mail" }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
