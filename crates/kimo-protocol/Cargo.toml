[package]
name = "kimo-protocol"
version = "0.1.0"
edition = "2021"
description = "Kimo's hand-written IMAP, POP3, SMTP and TLS transport"
license = "MIT"
publish = false

[dependencies]
kimo-core = { path = "../kimo-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
